name: Recount submission media 20260921
on:
  push:
    branches: [master]
    paths: [.github/workflows/submission-media-20260921.yml]
permissions:
  contents: read
  actions: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a10713f8d8869b63b1d50ed497fd2582481147a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: recount-live-voice-20260921
          run-id: 35630591053
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/recount-previous-proof
      - name: Install browser and stock narration generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install -r requirements-dev.txt kokoro-onnx==0.4.9 numpy==2.2.6 onnxruntime==1.22.1 soundfile==0.13.1
          python -m playwright install --with-deps chromium
      - name: Frame the actual ledger while keeping every original test assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('diagnostics/browser_live_voice.py');s=p.read_text();needle='        for filename,expected in ['
          assert s.count(needle)==1
          s=s.replace(needle,"        page.evaluate('window.scrollTo(0,330)')\n"+needle)
          p.write_text(s)
          PY
      - name: Record another real public interaction, not a mock or human holdout
        env:
          RECOUNT_DEMO_PASS: ${{ secrets.RECOUNT_DEMO_PASS }}
          RECOUNT_LIVE_OUT: /tmp/recount-media/browser
          RECOUNT_LIVE_INPUT: /tmp/recount-previous-proof/input
        run: python diagnostics/browser_live_voice.py
      - name: Generate stock voice narration for the accompanying walkthrough
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,wave
          from pathlib import Path
          import numpy as np
          from kokoro_onnx import Kokoro
          out=Path('/tmp/recount-media/narration');out.mkdir(parents=True,exist_ok=True)
          models=Path('/tmp/recount-narration-model');models.mkdir(exist_ok=True)
          expected={'kokoro-v1.0.onnx':'7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5','voices-v1.0.bin':'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d'}
          for name,digest in expected.items():
              target=models/name;urllib.request.urlretrieve('https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/'+name,target)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest
          model=Kokoro(str(models/'kokoro-v1.0.onnx'),str(models/'voices-v1.0.bin'));rows=[]
          for name,text in json.loads(Path('delivery/narration-20260921.json').read_text()).items():
              audio,sr=model.create(text,voice='bf_emma',speed=1.0,lang='en-gb');audio=np.asarray(audio,dtype=np.float32)
              assert np.isfinite(audio).all() and sr==24000
              with wave.open(str(out/(name+'.wav')),'wb') as f:
                  f.setnchannels(1);f.setsampwidth(2);f.setframerate(sr);f.writeframes((np.clip(audio,-1,1)*32767).astype('<i2').tobytes())
              rows.append({'name':name,'text':text,'seconds':len(audio)/sr,'sha256':hashlib.sha256((out/(name+'.wav')).read_bytes()).hexdigest()})
          (out/'MANIFEST.json').write_text(json.dumps({'voice':'Kokoro bf_emma','stock_narrator_not_builder_voice':True,'clips':rows},indent=2))
          PY
      - name: Preserve capture and provenance
        if: always()
        run: |
          mkdir -p /tmp/recount-media
          cp diagnostics/browser_live_voice.py /tmp/recount-media/capture-script.py
          cp delivery/narration-20260921.json /tmp/recount-media/narration-text.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-submission-media-20260921
          path: /tmp/recount-media/
          retention-days: 14
          if-no-files-found: error
