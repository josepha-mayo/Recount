name: Recount final submission check
on:
  push:
    branches: [master]
    paths: [.github/workflows/submission-final-check-20260921.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ebb05fee80a17f8e031f5f8d1ea40a1b0c7b602
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck pinned regressions without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recount-final-check
          git rev-parse HEAD > /tmp/recount-final-check/source-commit.txt
          node --test tests/*.test.mjs > /tmp/recount-final-check/node.log
          node --experimental-strip-types --test diagnostics/functions-env.test.mjs > /tmp/recount-final-check/auth.log 2>&1
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/recount-final-check/http.log 2>&1
      - name: Read-only live source and actual authorization/provider verification
        env:
          RECOUNT_DEMO_PASS: ${{ secrets.RECOUNT_DEMO_PASS }}
          RECOUNT_SOURCE_COMMIT: 3ebb05fee80a17f8e031f5f8d1ea40a1b0c7b602
          RECOUNT_RECEIPT: /tmp/recount-final-check/PRODUCTION.json
        run: node delivery/verify-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-final-submission-check
          path: /tmp/recount-final-check/
          retention-days: 30
          if-no-files-found: error
