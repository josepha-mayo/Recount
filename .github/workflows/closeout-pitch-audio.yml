name: Recount closeout pitch narration
on:
  push:
    branches: [master]
    paths: [.github/workflows/closeout-pitch-audio.yml]
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb3d7ee281f4902b5ce931d597e0bf1561fa4b4a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock voice generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install kokoro-onnx==0.4.9 numpy==2.2.6 onnxruntime==1.22.1 soundfile==0.13.1
      - name: Generate narration without provider calls or human voice cloning
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,wave
          from pathlib import Path
          import numpy as np
          from kokoro_onnx import Kokoro
          out=Path('/tmp/recount-pitch-audio');out.mkdir(exist_ok=True)
          models=Path('/tmp/recount-pitch-models');models.mkdir(exist_ok=True)
          expected={'kokoro-v1.0.onnx':'7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5','voices-v1.0.bin':'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d'}
          for name,digest in expected.items():
              target=models/name
              urllib.request.urlretrieve('https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/'+name,target)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest
          model=Kokoro(str(models/'kokoro-v1.0.onnx'),str(models/'voices-v1.0.bin'))
          script=json.loads(Path('submission/CLOSEOUT_NARRATION_20260922.json').read_text())
          rows=[]
          for segment in script['segments']:
              samples,sr=model.create(segment['text'],voice='af_heart',speed=1.05,lang='en-us')
              samples=np.asarray(samples,dtype=np.float32)
              assert np.isfinite(samples).all() and sr==24000
              name=segment['id']+'.wav'
              with wave.open(str(out/name),'wb') as wav:
                  wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(sr)
                  wav.writeframes((np.clip(samples,-1,1)*32767).astype('<i2').tobytes())
              rows.append({'id':segment['id'],'text':segment['text'],'seconds':len(samples)/sr,'sha256':hashlib.sha256((out/name).read_bytes()).hexdigest()})
          (out/'NARRATION.json').write_text(json.dumps({'title':script['title'],'voice':'Kokoro af_heart','human_voice':False,'purpose':'Added presentation narration, not original browser audio','model_hashes':expected,'segments':rows},indent=2))
          print(json.dumps({'segments':len(rows),'seconds':sum(r['seconds'] for r in rows),'human_voice':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recount-closeout-pitch-audio
          path: /tmp/recount-pitch-audio/
          retention-days: 14
          if-no-files-found: error
