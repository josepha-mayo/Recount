name: Recount production release
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'tests/**', 'netlify/**', 'server.py', 'delivery/**', 'diagnostics/*test.mjs', '.github/workflows/production-release.yml']
  push:
    branches: [master]
    paths: ['web/**', 'tests/**', 'netlify/**', 'server.py', 'delivery/**', 'diagnostics/*test.mjs', '.github/workflows/production-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Application, native authorization and browser regression gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recount-release-tests
          node --test tests/*.test.mjs > /tmp/recount-release-tests/node.log
          node --experimental-strip-types --test diagnostics/functions-env.test.mjs diagnostics/judge-auth.test.mjs > /tmp/recount-release-tests/authorization.log 2>&1
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/recount-release-tests/http.log 2>&1
          node --check delivery/verify-production.mjs
          node --check delivery/build-judge-verifier.mjs
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          RECOUNT_STARTUP_OUT=/tmp/recount-release-tests/startup python tests/browser_startup_errors.py
          RECOUNT_AUDIO_OUT=/tmp/recount-release-tests/audio python tests/browser_bundled_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-release-regressions
          path: /tmp/recount-release-tests/
          retention-days: 14
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: recount-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate private server verifier from the unchanged judge secret
        env:
          RECOUNT_DEMO_PASS: ${{ secrets.RECOUNT_DEMO_PASS }}
        run: node delivery/build-judge-verifier.mjs
      - name: Install pinned deployment CLI
        run: npm install --prefix /tmp/recount-deploy-cli netlify-cli@27.0.1 --no-audit --no-fund
      - name: Deploy existing site without storing the plaintext judge code
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: df8d4f20-8294-4f70-820a-731fa440156b
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          /tmp/recount-deploy-cli/node_modules/.bin/netlify deploy --prod --context production --site "$NETLIFY_SITE_ID" --skip-functions-cache --message "Verified Recount $GITHUB_SHA" --json > /tmp/recount-deploy-private.json
      - name: Verify actual production source, rejected control, accepted code and provider transport
        env:
          RECOUNT_DEMO_PASS: ${{ secrets.RECOUNT_DEMO_PASS }}
          RECOUNT_RECEIPT: /tmp/recount-production-proof/Recount-Production-Receipt.json
        run: node delivery/verify-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-production-proof
          path: /tmp/recount-production-proof/
          retention-days: 14
          if-no-files-found: warn
