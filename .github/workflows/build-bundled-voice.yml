name: Build Recount bundled voice
on:
  push:
    branches: [fix/bundled-neural-playback-20260919]
    paths: [.github/workflows/build-bundled-voice.yml]
permissions:
  contents: write
concurrency:
  group: recount-static-voice-build
  cancel-in-progress: false
jobs:
  voice-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bundled-neural-playback-20260919
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build-only voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install kokoro-onnx==0.4.9 numpy==2.2.6 onnxruntime==1.22.1 soundfile==0.13.1
      - name: Generate only public response clips
        run: python scripts/build_voice_bank.py
      - name: Commit generated audio, never model files or secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/bundled-neural-playback-20260919
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/voice/v1
          git diff --cached --name-only | grep -Ev '^web/voice/v1/[a-zA-Z0-9.-]+\.(mp3|json|txt)$' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git commit -m 'Bundle generated neural reply and number audio for device-independent playback'
          git pull --rebase origin fix/bundled-neural-playback-20260919
          git push origin HEAD:fix/bundled-neural-playback-20260919
      - uses: actions/upload-artifact@v4
        with:
          name: recount-bundled-voice-assets
          path: web/voice/v1/
          retention-days: 14
          if-no-files-found: error
