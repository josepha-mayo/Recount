name: Verify public Recount recovery
on:
  push:
    branches: [master]
    paths: ['.github/workflows/public-recovery-check.yml']
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b82c262cd962415721c5654541ec5c82bc49223b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Use real public controls and verify downloaded bytes
        run: |
          mkdir -p /tmp/recount-public
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          base='https://recount-voice-joseph.netlify.app';out=Path('/tmp/recount-public');checks=[];errors=[];sockets=[]
          def enter(page,text):
              page.locator('#utterance').fill(text);page.locator('#textForm button').click()
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for width,height in [(1360,1050),(390,844)]:
                  ctx=browser.new_context(viewport={'width':width,'height':height},accept_downloads=True)
                  page=ctx.new_page();page.on('pageerror',lambda e:errors.append(str(e)));page.on('websocket',lambda w:sockets.append(w.url.split('?')[0]))
                  response=page.goto(base+'/',wait_until='networkidle');assert response.status==200
                  expect(page.locator('#confirm')).to_be_disabled();checks.append(f'{width}:empty live draft cannot confirm')
                  enter(page,'rice twelve bags');enter(page,'no');expect(page.locator('#draft')).to_contain_text('?');expect(page.locator('#confirm')).to_be_disabled();checks.append(f'{width}:standalone correction invalidates old number')
                  enter(page,'thirteen bags');enter(page,'confirm twelve');expect(page.locator('#rows tr')).to_have_count(0);checks.append(f'{width}:stale quantity echo makes no write')
                  enter(page,'confirm thirteen');expect(page.locator('#rows tr')).to_have_count(1);expect(page.locator('#rows')).to_contain_text('13');checks.append(f'{width}:fresh quantity echo creates exactly one corrected record')
                  enter(page,'beans eight bags');enter(page,'soap');expect(page.locator('#reviewRows')).to_contain_text('Beans: 8 bags');expect(page.locator('#rows tr')).to_have_count(1);checks.append(f'{width}:moving to another item parks the unconfirmed draft')
                  enter(page,'two bars');enter(page,'confirm two');expect(page.locator('#rows tr')).to_have_count(2)
                  with page.expect_download() as info:page.locator('#csv').click()
                  info.value.save_as(out/f'pending-excluded-{width}.csv');assert (out/f'pending-excluded-{width}.csv').read_text()=='item,quantity,unit\nRice,13,bags\nSoap,2,bars\n';checks.append(f'{width}:actual CSV excludes unconfirmed review')
                  page.locator('#reviewRows button').click();expect(page.locator('#draft')).to_contain_text('8 bags');expect(page.locator('#rows tr')).to_have_count(2)
                  page.locator('#confirm').click();expect(page.locator('#rows tr')).to_have_count(3);checks.append(f'{width}:explicit review and confirmation finishes parked count')
                  with page.expect_download() as info:page.locator('#session').click()
                  info.value.save_as(out/f'session-{width}.json');assert json.loads((out/f'session-{width}.json').read_text())['schema']=='recount-session-2'
                  page.reload(wait_until='networkidle');expect(page.locator('#rows tr')).to_have_count(0);page.locator('#load').set_input_files(out/f'session-{width}.json');expect(page.locator('#rows tr')).to_have_count(3);checks.append(f'{width}:saved versioned actions reconstruct all completed records')
                  page.locator('summary').click();expect(page.locator('#accessWrap')).to_be_visible();expect(page.locator('#listen')).to_be_disabled();checks.append(f'{width}:real production microphone access remains gated')
                  assert page.evaluate('document.documentElement.scrollWidth<=window.innerWidth');assert not errors;checks.append(f'{width}:public app has no overflow or uncaught JavaScript error')
                  page.screenshot(path=str(out/f'public-{width}.png'),full_page=True);ctx.close()
              browser.close()
          assert not sockets,'No provider WebSocket should open in text review checks'
          result={'status':'passed','source_commit':'b82c262cd962415721c5654541ec5c82bc49223b','origin':base,'checks':checks,'check_count':len(checks),'provider_websockets':len(sockets),'provider_audio_calls':0,'physical_microphone_used':False,'scope':'Actual production UI, authored text inputs, CSV/session downloads and access controls. Not a human voice test.'}
          (out/'PUBLIC_BROWSER_RECEIPT.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Archive only the exact deployed source
        run: git archive --format=zip --prefix=Recount/ HEAD > /tmp/recount-public/Recount-Deployed-Source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-public-recovery-evidence
          path: /tmp/recount-public/
          retention-days: 14
          if-no-files-found: error
