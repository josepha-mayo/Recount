name: Recount published cover and state
on:
  push:
    branches: [master]
    paths: [.github/workflows/submission-cover-state-20260922.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture only the public cover for visual comparison
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,datetime
          from pathlib import Path
          root=Path('/tmp/recount-final-cover');root.mkdir(exist_ok=True)
          cover='https://storage.googleapis.com/lablab-static-eu/submissions/u76ct4tpwmv2c9j4q6pmq6fu/ay8wofq7algrj2jjxskb78rp/image/image_aei53hf7j56t1yafv50mkjnc.jpg'
          req=urllib.request.Request(cover,headers={'Cache-Control':'no-cache','User-Agent':'Recount-submission-verification'})
          with urllib.request.urlopen(req,timeout=25) as r:data=r.read(3000000)
          (root/'uploaded-cover.jpg').write_bytes(data)
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'cover_url':cover,'cover_sha256':hashlib.sha256(data).hexdigest(),'cover_bytes':len(data),'note':'For visual comparison. This JPEG is not byte-identical to the submitted source; no equality claim is made by this capture.'}
          (root/'COVER.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-published-cover-state
          path: /tmp/recount-final-cover/
          retention-days: 30
          if-no-files-found: error
