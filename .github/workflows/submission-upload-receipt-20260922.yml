name: Recount uploaded submission verification
on:
  push:
    branches: [master]
    paths: [.github/workflows/submission-upload-receipt-20260922.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public project and exact approved uploaded files
        run: |
          python - <<'PY'
          import hashlib,json,html,re,urllib.request,datetime
          from pathlib import Path
          from html.parser import HTMLParser
          out=Path('/tmp/recount-submission-receipt');out.mkdir(exist_ok=True)
          page='https://lablab.ai/ai-hackathons/assemblyai-voice-agent-hackathon/recount/recount-finish-the-stocktake'
          assets=[
           ('cover','https://storage.googleapis.com/lablab-static-eu/submissions/u76ct4tpwmv2c9j4q6pmq6fu/ay8wofq7algrj2jjxskb78rp/image/image_aei53hf7j56t1yafv50mkjnc.jpg',237730,'e902e0ce1375dc5a5c350c91a2aef84bb38001fc085543079015067e741f56ca'),
           ('video','https://storage.googleapis.com/lablab-video-submissions/submissions/u76ct4tpwmv2c9j4q6pmq6fu/ay8wofq7algrj2jjxskb78rp/video/video_obndxoi7fwrnjk9s7u2zzo75.mp4',6208080,'2c3bf0fd82d75d925955f21c36e7333e632203d471ae6fc4be45e7b37282f652'),
           ('slides','https://storage.googleapis.com/lablab-static-eu/submissions/u76ct4tpwmv2c9j4q6pmq6fu/ay8wofq7algrj2jjxskb78rp/presentation/presentation_jfhmqdjcwxrh592635cwg4m7.pdf',289959,'8b67c0fbd4f082a325695d268d2025ad0e597519b2ed3b56cb286cb46735a4f6')]
          def get(url,limit):
           req=urllib.request.Request(url,headers={'User-Agent':'Recount-submission-verification','Cache-Control':'no-cache'})
           with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read(limit)
          status,raw=get(page,3000000);text=raw.decode('utf8');(out/'public.html').write_bytes(raw)
          class Visible(HTMLParser):
           def __init__(self):super().__init__();self.hidden=0;self.parts=[]
           def handle_starttag(self,t,a):
            if t in ['script','style']:self.hidden+=1
           def handle_endtag(self,t):
            if t in ['script','style'] and self.hidden:self.hidden-=1
           def handle_data(self,d):
            if not self.hidden and d.strip():self.parts.append(d.strip())
          p=Visible();p.feed(text);visible='\n'.join(p.parts);(out/'public-text.txt').write_text(visible)
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'public_url':page,'public_http_status':status,'title_present':'Recount: Finish the Stocktake' in visible,'repository_link_present':'https://github.com/josepha-mayo/Recount' in text,'app_link_present':'https://recount-voice.netlify.app' in text,'visible_status_phrases':[s for s in ['Judging is in progress','Judging in progress','Submitted','Submission received'] if s.lower() in visible.lower()],'assets':[],'scope':'Read-only public-page and byte-for-byte uploaded-media verification. No new voice test or private account-status claim.'}
          for name,url,length,expected in assets:
           row={'kind':name,'url':url,'linked_from_public_page':url.split('/')[-1] in text}
           try:
            code,data=get(url,20000000);sha=hashlib.sha256(data).hexdigest()
            row.update(http_status=code,bytes=len(data),sha256=sha,exact_approved_file=sha==expected and len(data)==length)
           except Exception as e:row.update(exact_approved_file=False,error_type=type(e).__name__)
           report['assets'].append(row)
          report['status']='passed' if status==200 and report['title_present'] and report['repository_link_present'] and report['app_link_present'] and all(x['exact_approved_file'] and x['linked_from_public_page'] for x in report['assets']) else 'failed'
          (out/'RECEIPT.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          if report['status']!='passed':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-final-upload-receipt
          path: /tmp/recount-submission-receipt/
          retention-days: 30
          if-no-files-found: error
