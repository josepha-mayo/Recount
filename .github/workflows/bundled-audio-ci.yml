name: Recount bundled audio
on:
  pull_request:
    paths: ['web/**', 'tests/audio_readback.test.mjs', 'tests/browser_bundled_audio.py', 'server.py', '.github/workflows/bundled-audio-ci.yml']
  push:
    branches: [master]
    paths: ['web/**', 'tests/audio_readback.test.mjs', 'tests/browser_bundled_audio.py', 'server.py', '.github/workflows/bundled-audio-ci.yml']
permissions:
  contents: read
concurrency:
  group: recount-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      ALLOW_ASSEMBLYAI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/audio_readback.test.mjs
      - name: Decode real audio with native synthesis disabled
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          RECOUNT_AUDIO_OUT=/tmp/recount-bundled-ci python tests/browser_bundled_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recount-bundled-audio
          path: /tmp/recount-bundled-ci/
          retention-days: 14
          if-no-files-found: error
